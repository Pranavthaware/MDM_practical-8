<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-fixed"
      style="background-image: url('https://www.sbjit.edu.in/wp-content/uploads/2021/06/About-1.jpg');">

    <div class="min-h-screen bg-black/20 px-4 py-6 sm:px-6 sm:py-10 md:px-8">

        <div class="w-full max-w-md sm:max-w-lg mx-auto bg-white p-5 sm:p-6 md:p-8 rounded-lg shadow-lg">

            <h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-5 text-center">
                Student Registration
            </h2>

            <form id="registrationForm">

                <!-- Name -->
                <label class="text-sm sm:text-base">Student Name</label>
                <input type="text" id="name"
                    class="w-full border p-2 sm:p-3 mb-3 rounded text-sm sm:text-base">

                <!-- USN Number -->
                <label class="text-sm sm:text-base">USN Number</label>
                <input type="text" id="usn"
                    class="w-full border p-2 sm:p-3 mb-3 rounded text-sm sm:text-base">

                <!-- Email -->
                <label class="text-sm sm:text-base">Email</label>
                <input type="text" id="email"
                    class="w-full border p-2 sm:p-3 mb-3 rounded text-sm sm:text-base">

                <!-- Password -->
                <label class="text-sm sm:text-base">Password</label>
                <input type="password" id="password"
                    class="w-full border p-2 sm:p-3 mb-3 rounded text-sm sm:text-base">

                <button onclick="showpass()" id="togglePassword"
                    class="bg-blue-500 text-white p-2 rounded mb-3 text-sm sm:text-base">
                    Show Password
                </button><br>

                <!-- Mobile -->
                <label class="text-sm sm:text-base">Mobile Number</label>
                <input type="text" id="mobile"
                    class="w-full border p-2 sm:p-3 mb-4 rounded text-sm sm:text-base">

                <button type="submit"
                    class="w-full bg-blue-500 text-white p-2 sm:p-3 rounded text-sm sm:text-base">
                    Register
                </button>

                <p id="message" class="mt-4 text-center text-sm sm:text-base"></p>

            </form>
        </div>
    </div>


    <script>
        function showpass() {
            if (document.getElementById("password").type === "password") {
                document.getElementById("password").type = "text";
                document.getElementById("togglePassword").innerHTML = "Hide Password";
            } else {
                document.getElementById("password").type = "password";
                document.getElementById("togglePassword").innerHTML = "Show Password";
            }
        }

        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let usn = document.getElementById("usn").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || usn == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // USN validation
            if (usn == "") {
                message.innerHTML = "Please enter your USN number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            if (password.length < 6 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password) || !/[!@#$%^&*]/.test(password)) {
                message.innerHTML = "Password must be at least 6 characters and include an uppercase letter, a lowercase letter, a number, and a special character.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";

        };

    </script>

</body>
</html>
