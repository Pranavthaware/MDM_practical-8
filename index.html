<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-fixed"
      style="background-image: url('https://www.sbjit.edu.in/wp-content/uploads/2021/06/About-1.jpg');">

    <!-- Background Overlay -->
    <div class="min-h-screen bg-black/50 flex items-center justify-center px-3 py-5 sm:px-5 sm:py-8 md:px-8 md:py-10">

        <!-- Registration Card -->
        <div class="w-full max-w-[94%] sm:max-w-[600px] md:max-w-[620px] lg:max-w-[650px] bg-white p-5 sm:p-7 md:p-8 lg:p-9 rounded-2xl shadow-2xl">

            <!-- Heading -->
            <div class="text-center mb-6 sm:mb-7">
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-900">
                    Student Registration
                </h1>

                <p class="text-gray-500 text-sm sm:text-base mt-2">
                    Enter your details to register
                </p>
            </div>

            <form id="registrationForm">

                <!-- Student Name -->
                <div class="mb-4 sm:mb-5">
                    <label class="block text-sm sm:text-base font-medium text-gray-700 mb-2">
                        Student Name
                    </label>

                    <input type="text"
                           id="name"
                           placeholder="Enter your name"
                           class="w-full border border-gray-300 p-3 sm:p-3.5 md:p-4 rounded-xl text-sm sm:text-base outline-none focus:border-blue-500">
                </div>

                <!-- USN Number -->
                <div class="mb-4 sm:mb-5">
                    <label class="block text-sm sm:text-base font-medium text-gray-700 mb-2">
                        USN Number
                    </label>

                    <input type="text"
                           id="usn"
                           placeholder="Enter your USN number"
                           class="w-full border border-gray-300 p-3 sm:p-3.5 md:p-4 rounded-xl text-sm sm:text-base outline-none focus:border-blue-500">
                </div>

                <!-- Email -->
                <div class="mb-4 sm:mb-5">
                    <label class="block text-sm sm:text-base font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input type="text"
                           id="email"
                           placeholder="Enter your email"
                           class="w-full border border-gray-300 p-3 sm:p-3.5 md:p-4 rounded-xl text-sm sm:text-base outline-none focus:border-blue-500">
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="block text-sm sm:text-base font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           placeholder="Enter your password"
                           class="w-full border border-gray-300 p-3 sm:p-3.5 md:p-4 rounded-xl text-sm sm:text-base outline-none focus:border-blue-500">
                </div>

                <!-- Show Password -->
                <button onclick="showpass()"
                        id="togglePassword"
                        class="bg-blue-500 text-white p-2 sm:p-2.5 rounded-lg mb-5 text-sm sm:text-base">
                    Show Password
                </button>

                <br>

                <!-- Mobile Number -->
                <div class="mb-5 sm:mb-6">
                    <label class="block text-sm sm:text-base font-medium text-gray-700 mb-2">
                        Mobile Number
                    </label>

                    <input type="text"
                           id="mobile"
                           placeholder="Enter 10-digit mobile number"
                           class="w-full border border-gray-300 p-3 sm:p-3.5 md:p-4 rounded-xl text-sm sm:text-base outline-none focus:border-blue-500">
                </div>

                <!-- Register Button -->
                <button type="submit"
                        class="w-full bg-blue-500 text-white p-3 sm:p-3.5 md:p-4 rounded-xl text-sm sm:text-base md:text-lg font-medium">
                    Register
                </button>

                <!-- Message -->
                <p id="message" class="mt-4 sm:mt-5 text-center text-sm sm:text-base"></p>

            </form>
        </div>
    </div>

    <script>
        function showpass() {
            if (document.getElementById("password").type === "password") {
                document.getElementById("password").type = "text";
                document.getElementById("togglePassword").innerHTML = "Hide Password";
            } else {
                document.getElementById("password").type = "password";
                document.getElementById("togglePassword").innerHTML = "Show Password";
            }
        }

        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let usn = document.getElementById("usn").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || usn == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // USN validation
            if (usn == "") {
                message.innerHTML = "Please enter your USN number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            if (
                password.length < 6 ||
                !/[A-Z]/.test(password) ||
                !/[a-z]/.test(password) ||
                !/[0-9]/.test(password) ||
                !/[!@#$%^&*]/.test(password)
            ) {
                message.innerHTML = "Password must be at least 6 characters and include an uppercase letter, a lowercase letter, a number, and a special character.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";
        };
    </script>
</body>
</html>
